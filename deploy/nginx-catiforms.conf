# Cole dentro do bloco `server { ... }` HTTPS do seu domínio no nginx do servidor.

location = /catiforms {
    return 301 /catiforms/;
}

# API: /catiforms/api/forms -> http://127.0.0.1:3000/forms
location /catiforms/api/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Arquivos com hash no nome podem ficar em cache para sempre.
location /catiforms/assets/ {
    root /var/www;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Front (build do React em /var/www/catiforms). Rotas do SPA caem no index.html.
location /catiforms/ {
    root /var/www;
    try_files $uri /catiforms/index.html;
    add_header Cache-Control "no-cache";
}
