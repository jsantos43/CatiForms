# Banco de dados de produção. Só o Postgres roda no Docker; a API roda pelo systemd.
#   docker compose -f deploy/compose.yaml up -d
name: catiforms-prod

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: catiforms
      POSTGRES_PASSWORD: catiforms
      POSTGRES_DB: catiforms
    # Só no localhost: o banco não fica exposto para a internet.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catiforms -d catiforms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
