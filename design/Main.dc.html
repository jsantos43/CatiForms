<div style="min-height: 800px; display: flex; flex-wrap: wrap; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0F1B33">
  <section style="flex: 1 1 420px; background: #0A1F44; color: #FFFFFF; padding: 56px 56px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #1D5FD6; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      </div>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">Cati Forms</span>
    </div>
    <div style="max-width: 460px">
      <h1 style="margin: 0 0 16px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Crie, compartilhe e analise formulários.</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #C9D6F2">Plataforma de coleta e gerenciamento de formulários e respostas da CATI Jr.</p>
    </div>
    <p style="margin: 0; font-size: 13px; color: #9FB3DA">Banco de Talentos 2026 · CATI Jr.</p>
  </section>
  <section style="flex: 1 1 420px; padding: 56px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px">
      <div>
        <h2 style="margin: 0 0 8px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; color: #0A1F44">Entrar</h2>
        <p style="margin: 0; font-size: 15px; color: #4B5870">Acesse com seu username e senha.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="login-user" style="font-size: 14px; font-weight: 600; color: #0F1B33">Username</label>
        <input id="login-user" type="text" placeholder="seu.username" autocomplete="username" style="height: 44px; padding: 0 14px; border: 1px solid #C5D0E3; border-radius: 8px; font: inherit; font-size: 15px; color: #0F1B33; background: #FFFFFF">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="login-pass" style="font-size: 14px; font-weight: 600; color: #0F1B33">Senha</label>
        <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password" style="height: 44px; padding: 0 14px; border: 1px solid #C5D0E3; border-radius: 8px; font: inherit; font-size: 15px; color: #0F1B33; background: #FFFFFF">
      </div>
      <a href="Formularios.dc.html" style="height: 46px; display: flex; align-items: center; justify-content: center; background: #1D5FD6; color: #FFFFFF; border-radius: 8px; font-weight: 600; font-size: 15px; text-decoration: none">Entrar</a>
      <p style="margin: 0; text-align: center; font-size: 14px; color: #4B5870">Ainda não tem conta? <a href="Cadastro.dc.html" style="font-weight: 600">Criar conta</a></p>

  </section>
